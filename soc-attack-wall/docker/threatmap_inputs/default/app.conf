# Entrees de donnees du mur pour un Splunk local (docker-compose.yml).
# Hors du paquet de l'appli : un index et des ports d'ecoute ne se livrent pas
# dans une appli Splunkbase / Splunk Cloud.
[install]
is_configured = true

[ui]
is_visible = false
label = Threat Map - entrees

[launcher]
description = Index threatmap et entrees syslog des sources du mur.
version = 1.0.0
